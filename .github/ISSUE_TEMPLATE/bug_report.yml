name: Something isn't working
description: WPMark won't install, won't connect, or gives wrong data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Please don't include passwords, connection keys,
        your site visitors' form entries, or screenshots showing customer details.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Include the exact error message.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which AI app?
      options:
        - Claude (web, desktop or mobile)
        - ChatGPT
        - Gemini
        - Claude Code
        - Cursor or Windsurf
        - VS Code
        - Other / not relevant
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Health report
      description: WPMark → Health check → Copy health report, then paste it here. It has no leads, passwords or keys.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Your host, security or caching plugins, or anything you already tried.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed passwords, keys and any visitor or customer data from this report.
          required: true
