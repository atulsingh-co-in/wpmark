# Runs the same checks as `composer lint` and `composer test` on every push
# and pull request.
#
# Actions are pinned to exact commits (with the version in a comment) so a
# changed tag upstream cannot change what runs here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every supported PHP version: 8.2 is the lowest that still gets
        # security fixes.
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -not -path './.wp/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Find Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: WordPress Coding Standards
        # The standards check does not depend on the PHP version, so run it once.
        if: matrix.php == '8.2'
        run: composer lint -- --no-cache

  test:
    name: Tests (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}${{ matrix.elementor && ', Elementor' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Our minimum WordPress and whatever is newest today.
        wp: ['6.9', 'latest']
        elementor: ['']
        include:
          # Once more with the real Elementor plugin, for the page builder tests.
          - php: '8.4'
            wp: 'latest'
            elementor: 'v4.0.8'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wpmark_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WPMARK_TEST_DB_HOST: 127.0.0.1:3306
      WPMARK_TEST_DB_NAME: wpmark_tests
      WPMARK_TEST_DB_USER: root
      WPMARK_TEST_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Find Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: Download WordPress ${{ matrix.wp }}
        id: wp
        run: echo "version=$(bin/install-wp.sh '${{ matrix.wp }}' | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Match the test framework to WordPress ${{ steps.wp.outputs.version }}
        run: |
          minor="$(echo '${{ steps.wp.outputs.version }}' | cut -d. -f1,2)"
          composer update wp-phpunit/wp-phpunit --with "wp-phpunit/wp-phpunit:${minor}.*" --no-interaction --no-progress

      - name: Download Elementor ${{ matrix.elementor }}
        if: matrix.elementor != ''
        run: |
          git clone --quiet --depth 1 --branch '${{ matrix.elementor }}' --filter=blob:limit=2m https://github.com/elementor/elementor.git .wp/elementor
          echo "WPMARK_TEST_ELEMENTOR_DIR=$PWD/.wp/elementor" >> "$GITHUB_ENV"

      - name: Run tests
        run: composer test
